<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="513px" preserveAspectRatio="none" style="width:983px;height:513px;background:#FFFFFF;" version="1.1" viewBox="0 0 983 513" width="983px" zoomAndPan="magnify"><title>Tusinik &#8212; System context (DIP-8)</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="230.8496" x="369.0967" y="23.5625">Tusinik &#8212; System context (DIP-8)</text><!--entity Reader--><g id="elem_Reader"><ellipse cx="77.5347" cy="51.9395" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M77.5347,59.9395 L77.5347,86.9395 M64.5347,67.9395 L90.5347,67.9395 M77.5347,86.9395 L64.5347,101.9395 M77.5347,86.9395 L90.5347,101.9395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="47.0381" x="6" y="117.002">Reader</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="143.0693" x="6" y="133.9414">(person with aphasia)</text></g><!--entity Relative--><g id="elem_Relative"><ellipse cx="77.457" cy="181.4395" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M77.457,189.4395 L77.457,216.4395 M64.457,197.4395 L90.457,197.4395 M77.457,216.4395 L64.457,231.4395 M77.457,216.4395 L90.457,231.4395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="127.9141" x="13.5" y="246.502">Relative / caregiver</text></g><!--entity Therapist--><g id="elem_Therapist"><ellipse cx="77.2959" cy="293.9395" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M77.2959,301.9395 L77.2959,328.9395 M64.2959,309.9395 L90.2959,309.9395 M77.2959,328.9395 L64.2959,343.9395 M77.2959,328.9395 L90.2959,343.9395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="117.5918" x="18.5" y="359.002">Speech-language</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="58.085" x="18.5" y="375.9414">therapist</text></g><!--entity Dev--><g id="elem_Dev"><ellipse cx="77.2744" cy="422.9395" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M77.2744,430.9395 L77.2744,457.9395 M64.2744,438.9395 L90.2744,438.9395 M77.2744,457.9395 L64.2744,472.9395 M77.2744,457.9395 L90.2744,472.9395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="85.5996" x="32" y="488.002">Developer of</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="90.5488" x="32" y="504.9414">another client</text></g><!--entity Tusinik--><g id="elem_Tusinik"><rect fill="#DDEBFF" height="138.5762" rx="2.5" ry="2.5" style="stroke:#1F4E9A;stroke-width:0.5;" width="304.3682" x="335" y="202.9395"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="63.8682" x="455.25" y="226.502">&#171;system&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="106.8936" x="345" y="243.4414">Tusinik platform</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.9375" x="345" y="260.3809">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="259.4854" x="345" y="277.3203">Extracts the main text of a web page or</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="271.9609" x="345" y="294.2598">pasted text, simplifies it at a chosen level</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="284.3682" x="345" y="311.1992">(RU / KZ / EN), checks meaning and shows</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="206.7598" x="345" y="328.1387">it in an accessible reading view</text></g><!--entity Web--><g id="elem_Web"><rect fill="#F2F2F2" height="87.7578" rx="2.5" ry="2.5" style="stroke:#777777;stroke-width:0.5;" width="152.2207" x="821.5" y="105.4395"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70.2119" x="862.5044" y="129.002">&#171;external&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="103.6123" x="831.5" y="145.9414">Public websites</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="132.2207" x="831.5" y="162.8809">(news, government,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="124.8652" x="831.5" y="179.8203">health information)</text></g><!--entity LLM--><g id="elem_LLM"><rect fill="#F2F2F2" height="87.7578" rx="2.5" ry="2.5" style="stroke:#777777;stroke-width:0.5;" width="159.043" x="818" y="228.4395"/><text fill="#000000" font-family="Arial" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="70.2119" x="862.4155" y="252.002">&#171;external&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="139.043" x="828" y="268.9414">Language-model API</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="113.9551" x="828" y="285.8809">(hosted provider,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="95.6963" x="828" y="302.8203">selected in P1)</text></g><!--entity Browser--><g id="elem_Browser"><rect fill="#F2F2F2" height="87.7578" rx="2.5" ry="2.5" style="stroke:#777777;stroke-width:0.5;" width="140.0596" x="827.5" y="351.4395"/><